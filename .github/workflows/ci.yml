name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX (dry-run)
        run: npx vsce package --no-git-tag-version --out go-fahh.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-fahh-vsix
          path: go-fahh.vsix
          retention-days: 7
